[package]
name = "dn7-website"
version = "0.1.0"
edition = "2021"
description = "Digital Network 7 (dn7.cn) public website + API — single self-contained binary"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
# Embed the built frontend (frontend/dist) directly into the binary so the
# whole site ships as ONE deployable file — no separate static folder.
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
# Upstream proxy to the existing agent-distribution origin (download/version).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Verify the Ed25519 release signature appended to every pushed panel binary,
# using the SAME embedded public key the panel itself trusts. This is the auth
# for the CI push endpoint: only the release-key holder can produce a binary the
# site accepts (no shared secret/token needed). Pure Rust, musl-static safe.
ed25519-dalek = "2"
# SHA-256 of stored binaries (shown in the admin UI / manifests). Pure Rust.
sha2 = "0.10"
# Random admin password (when none is configured) + session tokens. Pure Rust.
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
